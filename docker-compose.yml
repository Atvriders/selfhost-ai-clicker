version: '3.8'

services:
  app:
    image: ghcr.io/atvriders/selfhost-ai-clicker:latest
    container_name: selfhost-ai-clicker
    ports:
      - "3020:3020"
    restart: unless-stopped

# Static subnet so this stack never consumes Docker's default address pool
# (avoids "all predefined address pools have been fully subnetted").
networks:
  default:
    ipam:
      config:
        - subnet: 10.77.20.0/24
